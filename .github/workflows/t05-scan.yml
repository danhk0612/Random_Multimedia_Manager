name: T05 library scan verification
on:
  pull_request:
    paths:
      - '**/packages.lock.json'
      - '**/*.csproj'
      - 'RandomMultimediaManager.sln'
      - 'NuGet.Config'
      - 'global.json'
      - 'src/RandomMultimediaManager.App/Data/**'
      - 'src/RandomMultimediaManager.App/Scanning/**'
      - 'src/RandomMultimediaManager.App/ViewModels/CategoryEditorViewModel.cs'
      - 'src/RandomMultimediaManager.App/Views/CategoryEditorView.xaml*'
      - 'tests/RandomMultimediaManager.Scanner.Tests/**'
      - '.github/workflows/t05-scan.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify exact head and global.json SDK
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($head -ne '${{ github.event.pull_request.head.sha }}') { throw 'Unexpected checkout SHA.' }
          Write-Output "Verified checkout SHA: $head"
          $expected = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $actual = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw "SDK mismatch: expected $expected, actual $actual" }
          Write-Output "Verified global.json SDK: $actual"
      - run: dotnet --info
      - run: dotnet restore RandomMultimediaManager.sln
      - run: dotnet build RandomMultimediaManager.sln -c Release --no-restore
      - run: dotnet restore tests/RandomMultimediaManager.Scanner.Tests/RandomMultimediaManager.Scanner.Tests.csproj
      - name: Basic scan and extension policy
        timeout-minutes: 2
        run: dotnet run --project tests/RandomMultimediaManager.Scanner.Tests -c Release --no-restore -- basic
      - name: Missing and path-state policy
        timeout-minutes: 2
        run: dotnet run --project tests/RandomMultimediaManager.Scanner.Tests -c Release --no-restore -- state
      - name: Cancellation policy
        timeout-minutes: 2
        run: dotnet run --project tests/RandomMultimediaManager.Scanner.Tests -c Release --no-restore -- cancel
      - name: Access-denied preservation
        timeout-minutes: 2
        run: dotnet run --project tests/RandomMultimediaManager.Scanner.Tests -c Release --no-restore -- access
      - name: Reparse partial-failure preservation
        timeout-minutes: 2
        run: dotnet run --project tests/RandomMultimediaManager.Scanner.Tests -c Release --no-restore -- reparse
      - name: Case-sensitive directory rejection
        timeout-minutes: 2
        run: dotnet run --project tests/RandomMultimediaManager.Scanner.Tests -c Release --no-restore -- case
      - name: T18A-5 UNC path normalization
        timeout-minutes: 2
        run: dotnet run --project tests/RandomMultimediaManager.Scanner.Tests -c Release --no-restore -- unc
      - name: T18A-5 source policy and explicit binding UI contract
        timeout-minutes: 3
        run: dotnet run --project tests/RandomMultimediaManager.Scanner.Tests -c Release --no-restore -- t18a5
      - name: T18A-2 source admission and IO drain
        timeout-minutes: 3
        run: dotnet run --project tests/RandomMultimediaManager.Scanner.Tests -c Release --no-restore -- lifecycle
