name: T06 random pending verification
on:
  pull_request:
    paths:
      - '**/packages.lock.json'
      - '**/*.csproj'
      - 'RandomMultimediaManager.sln'
      - 'NuGet.Config'
      - 'global.json'
      - 'src/RandomMultimediaManager.Core/**'
      - 'src/RandomMultimediaManager.App/Sessions/**'
      - 'src/RandomMultimediaManager.App/Data/**'
      - 'tests/RandomMultimediaManager.Core.Tests/**'
      - 'tests/RandomMultimediaManager.Data.Tests/**'
      - '.github/workflows/t06-session.yml'
permissions:
  contents: read
jobs:
  session:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify exact head and global.json SDK
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($head -ne '${{ github.event.pull_request.head.sha }}') { throw 'Unexpected checkout SHA.' }
          Write-Output "Verified checkout SHA: $head"
          $expected = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $actual = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw "SDK mismatch: expected $expected, actual $actual" }
          Write-Output "Verified global.json SDK: $actual"
      - run: dotnet --info
      - run: dotnet restore RandomMultimediaManager.sln
      - run: dotnet build RandomMultimediaManager.sln -c Release --no-restore
      - run: dotnet run --project tests/RandomMultimediaManager.Core.Tests -c Release --no-build
      - run: dotnet run --project tests/RandomMultimediaManager.Data.Tests -c Release --no-build
      - name: Scanner regression (Windows paths and file system)
        shell: pwsh
        run: |
          dotnet restore tests/RandomMultimediaManager.Scanner.Tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($scenario in @('basic','state','cancel','access','reparse','case')) {
            dotnet run --project tests/RandomMultimediaManager.Scanner.Tests -c Release --no-restore -- $scenario
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
