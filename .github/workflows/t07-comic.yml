name: T07 comic archive verification
on:
  pull_request:
    paths:
      - '**/packages.lock.json'
      - '**/*.csproj'
      - 'NuGet.Config'
      - 'global.json'
      - 'src/RandomMultimediaManager.App/Media/Comic/**'
      - 'tests/RandomMultimediaManager.Comic.Tests/**'
      - 'RandomMultimediaManager.sln'
      - '.github/workflows/t07-comic.yml'
permissions:
  contents: read
jobs:
  comic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify exact head and global.json SDK
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($head -ne '${{ github.event.pull_request.head.sha }}') { throw 'Unexpected checkout SHA.' }
          Write-Output "Verified checkout SHA: $head"
          $expected = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $actual = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw "SDK mismatch: expected $expected, actual $actual" }
          Write-Output "Verified global.json SDK: $actual"
      - run: dotnet restore RandomMultimediaManager.sln
      - run: dotnet build RandomMultimediaManager.sln -c Release --no-restore
      - run: dotnet run --project tests/RandomMultimediaManager.Comic.Tests -c Release --no-build
